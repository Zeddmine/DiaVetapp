    <script>
      // Load saved theme immediately to prevent white/dark flash
      try {
        var savedTheme = localStorage.getItem('diavet_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}

      // Automatically clean any legacy or intercepting service workers and caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if (typeof window !== 'undefined' && 'caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            if (names[i].indexOf('workbox') !== -1 || window.location.port === '3000' || window.location.hostname.includes('dev')) {
              caches.delete(names[i]);
            }
          }
        });
      }
    </script>
