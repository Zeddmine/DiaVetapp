<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Cyan to Sky Neon Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Emerald to Mint Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Medical Pulse Cross Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- iOS / Android Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Precision Neon Borders -->
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.5"/>
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="14 8"/>

  <!-- Ambient Glow Backlights -->
  <circle cx="256" cy="220" r="130" fill="#0284c7" fill-opacity="0.2" filter="url(#softGlow)"/>
  <circle cx="256" cy="300" r="120" fill="#059669" fill-opacity="0.2" filter="url(#softGlow)"/>

  <!-- Developer Code Bracket Accent (Left) -->
  <path d="M 115 190 L 75 230 L 115 270" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Developer Code Bracket Accent (Right) -->
  <path d="M 397 190 L 437 230 L 397 270" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Stethoscope Binaural Tubes (Minimalist Cyan) -->
  <path d="M 175 130 C 175 210, 205 240, 256 240 C 307 240, 337 210, 337 130" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round"/>
  <!-- Ear Tips -->
  <circle cx="175" cy="130" r="14" fill="#38bdf8"/>
  <circle cx="337" cy="130" r="14" fill="#38bdf8"/>

  <!-- Stethoscope Center Stem -->
  <path d="M 256 240 L 256 310" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Stethoscope Chestpiece / Sensor Disc (Emerald Core) -->
  <circle cx="256" cy="350" r="48" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="350" r="28" fill="#064e3b" stroke="#34d399" stroke-width="5"/>
  
  <!-- Minimalist Paw Silhouette in Center -->
  <circle cx="256" cy="356" r="9" fill="#6ee7b7"/>
  <circle cx="245" cy="343" r="4.5" fill="#6ee7b7"/>
  <circle cx="256" cy="339" r="4.5" fill="#6ee7b7"/>
  <circle cx="267" cy="343" r="4.5" fill="#6ee7b7"/>

  <!-- Dynamic ECG / Health Wave Across Base -->
  <path d="M 90 430 L 170 430 L 195 400 L 220 465 L 250 390 L 280 445 L 305 415 L 330 430 L 422 430" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Modern Corner Nodes -->
  <circle cx="60" cy="60" r="7" fill="#38bdf8"/>
  <circle cx="452" cy="60" r="7" fill="#34d399"/>
  <circle cx="60" cy="452" r="7" fill="#34d399"/>
  <circle cx="452" cy="452" r="7" fill="#38bdf8"/>

  <!-- Top System Status Indicators -->
  <circle cx="236" cy="70" r="5" fill="#ef4444"/>
  <circle cx="256" cy="70" r="5" fill="#f59e0b"/>
  <circle cx="276" cy="70" r="5" fill="#10b981"/>
</svg>
